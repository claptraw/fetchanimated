name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q
      - name: Beets plugin smoke test
        shell: bash
        run: |
          export BEETSDIR="$RUNNER_TEMP/beets-fetchanimated"
          mkdir -p "$BEETSDIR"
          cat > "$BEETSDIR/config.yaml" <<'YAML'
          plugins: fetchanimated
          fetchanimated:
            auto: no
            full_library_log: ""
            limit_log: ""
          YAML
          beet version
          beet help fetchanimated
          beet fetchanimated --dry-run
      - name: Build distributions
        run: python -m build
